project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "reference/*.qmd"
    - "examples/*.qmd"
  resources:
    - data/*.csv

website:
  site-url: "https://phpolars.phpstats.org/docs"
  title: "phpolars"
  repo-url: "https://github.com/phpstats/phpolars"
  sidebar:
    style: docked
    search: true
    contents:
      - index.qmd
      - getting-started.qmd
      - section: "Examples"
        contents:
          - examples/expressions.qmd
          - examples/lazy-csv.qmd
          - examples/time-series.qmd
      - section: "Guides"
        contents:
          - coming-from-python.qmd
          - phibble.qmd
          - deployment.qmd
      - section: "Reference"
        contents:
          - reference/dataframe.qmd
          - reference/expressions.qmd
          - reference/series.qmd
          - reference/io.qmd
          - reference/types.qmd
      - compatibility.qmd
      - section: "Benchmarks and verification"
        contents:
          - performance.qmd
      - section: "Contributing"
        contents:
          - development.qmd
format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    highlight-style: github
