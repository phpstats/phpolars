name: Prepare versioned release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployment:
    uses: ./.github/workflows/packaging.yml
  source:
    needs: deployment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag, crate version, and MIT license
        run: |
          python3 - <<'PY'
          import os, pathlib, re, tomllib
          root = pathlib.Path('.')
          version = tomllib.loads((root / 'Cargo.toml').read_text())['package']['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?', version)
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'tag/crate version mismatch'
          assert (root / 'LICENSE').read_text().startswith('MIT License')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('RELEASE_VERSION=' + version + '\n')
          PY
      - name: Source archive and checksums
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="phpolars-$RELEASE_VERSION/" HEAD > "dist/phpolars-$RELEASE_VERSION.tar.gz"
          sha256sum "dist/phpolars-$RELEASE_VERSION.tar.gz" > dist/SHA256SUMS
      - name: Check required package files
        run: |
          python3 - <<'PY'
          import os, tarfile
          version = os.environ['RELEASE_VERSION']
          with tarfile.open(f'dist/phpolars-{version}.tar.gz') as archive:
              names = {p.name.removeprefix(f'phpolars-{version}/') for p in archive.getmembers()}
          for path in ['LICENSE', 'composer.json', 'Cargo.lock', 'Cargo.toml', 'pie/config.m4',
                       'pie/Makefile.frag', 'src/lib.rs', 'tests/deployment.php', 'stubs/phpolars.php']:
              assert path in names, path
          assert not any(p.startswith(('docs/_site/', 'docs/_freeze/')) for p in names)
          PY
      - name: Verify installation from the source archive itself
        run: |
          mkdir -p .context/source-test
          tar -xzf "dist/phpolars-$RELEASE_VERSION.tar.gz" -C .context/source-test
          source_root=".context/source-test/phpolars-$RELEASE_VERSION"
          docker build --progress=plain --target checks -f "$source_root/docker/Dockerfile" -t archive-checks "$source_root"
          docker build --progress=plain -f "$source_root/docker/Dockerfile" -t archive-runtime "$source_root"
          "$source_root/scripts/check-container" archive-runtime archive-checks > dist/deployment.json
      - uses: actions/upload-artifact@v4
        with:
          name: phpolars-source
          path: dist/

  publish:
    needs: source
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create the GitHub release with source and binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 - "$version" > notes.md <<'PY'
          import re, sys
          text = open('CHANGELOG.md').read()
          match = re.search(r'^## ' + re.escape(sys.argv[1]) + r'\n(.*?)(?=^## |\Z)', text, re.S | re.M)
          print(match.group(1).strip() if match else 'Release ' + sys.argv[1])
          PY
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md \
            artifacts/phpolars-source/* artifacts/linux-*-nts-bookworm/*

  verify-release:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        php: ['8.3', '8.4', '8.5']
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - php: '8.3'
            image: php:8.3-fpm-bookworm@sha256:f768bd9142444f6126a690697b028c23f30878c3b628a7c355dfce75e29cc045
          - php: '8.4'
            image: php:8.4-fpm-bookworm@sha256:6bfef8e416977aa41f48e3e42a40c1e08050d24e4a938c6edb421400bff24601
          - php: '8.5'
            image: php:8.5-fpm-bookworm@sha256:dd198c828c224e479bdaa184cdcf04a28c73d186bf5a885493bf9cc78d7196ef
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the attached binary into a clean PHP ${{ matrix.php }} image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download "$GITHUB_REF_NAME" --dir release --pattern "php_php_polars-${GITHUB_REF_NAME}_php${{ matrix.php }}-${{ matrix.arch }}-linux-glibc-nts.*"
          cd release && sha256sum -c ./*.sha256 && unzip -q ./*.zip -d binary && cd ..
          docker run --rm -v "$PWD:/src:ro" "${{ matrix.image }}" sh -c '
            cp /src/release/binary/php_polars.so "$(php-config --extension-dir)/" &&
            echo "extension=php_polars.so" > /usr/local/etc/php/conf.d/php_polars.ini &&
            php /src/tests/deployment.php'
      - name: PIE picks the prebuilt binary in a clean image without Rust
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GH_TOKEN -e TAG="$GITHUB_REF_NAME" -v "$PWD:/src:ro" "${{ matrix.image }}" sh -euc '
            apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip >/dev/null
            curl -fsSL https://github.com/php/pie/releases/download/1.5.0/pie.phar -o /usr/local/bin/pie
            echo "d195dc35d311b6e0d5e2a3bd02893628f9898db3c004563f0c3a333a02010873  /usr/local/bin/pie" | sha256sum -c -
            export COMPOSER_AUTH="{\"github-oauth\":{\"github.com\":\"$GH_TOKEN\"}}"
            php /usr/local/bin/pie repository:add vcs https://github.com/${{ github.repository }}
            php /usr/local/bin/pie install "phpstats/phpolars:${TAG#v}" --no-interaction --no-build-tools-check | tee /tmp/pie.log
            grep -q "Found prebuilt archive" /tmp/pie.log
            ! command -v cargo
            php -m | grep -qx php_polars
            php /src/tests/deployment.php'
