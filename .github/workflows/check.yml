name: Rust and PHP checks
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        php: ['8.3', '8.4', '8.5']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, so scripts/check can compare the API with the latest release.
          fetch-depth: 0
      - name: PHP ${{ matrix.php }} with headers
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: php-config, phpize
      - name: Linux clang
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev
          echo "PHP=$(command -v php)" >> "$GITHUB_ENV"
          echo "PHP_CONFIG=$(command -v php-config)" >> "$GITHUB_ENV"
      - name: macOS clang
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          llvm_prefix="$(brew --prefix llvm)"
          echo "PHP=$(command -v php)" >> "$GITHUB_ENV"
          echo "PHP_CONFIG=$(command -v php-config)" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$llvm_prefix/lib" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-resource-dir=$($llvm_prefix/bin/clang -print-resource-dir) -isysroot=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Stable Rust
        run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # ext-php-rs builds against each PHP version's headers.
          key: php-${{ matrix.php }}
      - name: Release gate
        run: ./scripts/check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - run: composer install --no-interaction --no-progress

      - run: composer lint
